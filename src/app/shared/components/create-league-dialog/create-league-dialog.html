<!-- Backdrop -->
<div class="cld-backdrop" (click)="cancel()" aria-hidden="true"></div>

<!-- Dialog -->
<div class="cld-dialog" role="dialog" aria-modal="true" aria-labelledby="cld-title">

  <div class="cld-header">
    <span class="cld-header__icon"><i class="pi pi-trophy"></i></span>
    <h2 class="cld-title" id="cld-title">Crear nueva liga</h2>
    <button type="button" class="cld-close" (click)="cancel()" aria-label="Cerrar">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <div class="cld-body">
    @if (submitting()) {
      <div class="cld-submitting">
        <i class="pi pi-spin pi-spinner"></i>
        <span>Creando liga…</span>
      </div>
    } @else {
      <app-dynamic-form
        [fields]="fields"
        (data)="onFormData($event)"
      />
    }
  </div>

</div>
